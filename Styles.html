<style>
:root {
  --bg-page: #f1f5f9;
  --bg-surface: #ffffff;
  --bg-subtle: #f8fafc;
  --bg-sidebar: #0f172a;
  --bg-sidebar-hover: #1e293b;
  --bg-sidebar-active: #1d4ed8;
  --border-color: #cbd5e1;
  --border-strong: #94a3b8;
  --text-main: #0f172a;
  --text-muted: #475569;
  --text-light: #64748b;
  --primary: #1d4ed8;
  --primary-hover: #1e40af;
  --danger: #b91c1c;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  --warn: #b45309;
  --warn-bg: #fffbeb;
  --warn-border: #fde68a;
  --ok: #15803d;
  --ok-bg: #f0fdf4;
  --ok-border: #bbf7d0;
  --info: #0369a1;
  --info-bg: #f0f9ff;
  --info-border: #bae6fd;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* {
  box-sizing: border-box;
  border-radius: 0 !important;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-page);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
}

.hidden { display: none !important; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--text-muted); }
.fw-600 { font-weight: 600; }

/* Icons */
.icon { display: inline-block; vertical-align: middle; flex-shrink: 0; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-main);
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-subtle); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #ffffff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #ffffff; }
.btn-danger:hover { background: #991b1b; }
.btn-sm { padding: 4px 8px; font-size: 11.5px; }
.btn-link { background: transparent; border: none; color: var(--primary); padding: 0; font-weight: 600; cursor: pointer; text-decoration: underline; }

/* Auth Shell */
.auth-shell {
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #0f172a;
}
.auth-bg-img {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
.auth-bg-overlay {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.58));
  z-index: 1;
}
.auth-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 420px;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  box-shadow: 0 20px 45px rgba(2, 6, 23, 0.45);
  padding: 28px;
}
.auth-logo-wrap {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}
.auth-logo {
  max-height: 64px;
  max-width: 220px;
  object-fit: contain;
  display: block;
  background: transparent;
}
.auth-kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 6px;
}
.auth-title {
  margin: 0 0 6px;
  font-size: 20px;
  font-weight: 700;
}
.auth-subtitle {
  margin: 0 0 18px;
  color: var(--text-muted);
  font-size: 12.5px;
}
.auth-alert {
  padding: 9px 12px;
  border: 1px solid var(--border-color);
  margin-bottom: 14px;
  font-size: 12px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.auth-alert-error { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
.auth-alert-info { background: var(--info-bg); border-color: var(--info-border); color: var(--info); }

/* Main Layout */
.page-shell {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 236px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--bg-sidebar);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #020617;
}
.sidebar-brand {
  height: 72px;
  flex-shrink: 0;
  padding: 0 14px;
  border-bottom: 1px solid #1e293b;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-logo-box {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  background: transparent;
  padding: 0;
  margin-bottom: 0;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sidebar-logo {
  max-height: 100%;
  max-width: 100%;
  object-fit: contain;
  display: block;
}
.sidebar-brand-text {
  min-width: 0;
}
.sidebar-brand-kicker {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #60a5fa;
}
.sidebar-brand-title {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  margin-top: 2px;
}
.sidebar-nav {
  flex: 1;
  padding: 10px 0;
}
.sidebar-nav-label {
  padding: 10px 16px 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #64748b;
}
.sidebar-nav-link {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border: none;
  background: transparent;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  border-left: 3px solid transparent;
}
.sidebar-nav-link:hover { background: var(--bg-sidebar-hover); color: #ffffff; }
.sidebar-nav-link.is-active {
  background: var(--bg-sidebar-hover);
  color: #ffffff;
  font-weight: 600;
  border-left-color: #3b82f6;
}
.avatar-round {
  border-radius: 50% !important;
}
.sidebar-footer {
  padding: 8px;
  border-top: 1px solid #1e293b;
  font-size: 12px;
}
.sidebar-user-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: transparent;
  border: 1px solid transparent;
  color: #e2e8f0;
  text-align: left;
  cursor: pointer;
}
.sidebar-user-card:hover {
  background: var(--bg-sidebar-hover);
  border-color: #334155;
}
.sidebar-user-card.is-active {
  background: var(--bg-sidebar-hover);
  border-color: #3b82f6;
}
.sidebar-avatar {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  background: #1d4ed8;
  color: #ffffff;
  border: 1px solid #60a5fa;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-weight: 700;
  font-size: 12.5px;
}
.sidebar-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.sidebar-user-meta { min-width: 0; flex: 1; }
.sidebar-user-name {
  font-weight: 600;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-user-role {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Profile Page */
.profile-hero { padding: 18px; }
.profile-hero-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.profile-identity {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.profile-avatar {
  width: 74px;
  height: 74px;
  flex-shrink: 0;
  background: #1d4ed8;
  color: #ffffff;
  border: 2px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-weight: 700;
  font-size: 22px;
}
.profile-avatar-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.profile-name {
  margin: 0 0 4px;
  font-size: 18px;
  font-weight: 700;
}
.profile-meta-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.profile-meta-dates {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.profile-photo-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.profile-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 14px;
}

.page-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.page-header {
  height: 72px;
  flex-shrink: 0;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.page-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
.page-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.2; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.page-actions .btn {
  height: 28px;
  padding: 0 10px;
  line-height: 1;
  box-sizing: border-box;
}

.page-content {
  padding: 18px 20px 28px;
  flex: 1;
}

/* KPI Grid & Panels */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  padding: 12px 14px;
  border-top: 3px solid var(--primary);
}
.kpi-card.kpi-warn { border-top-color: var(--warn); }
.kpi-card.kpi-danger { border-top-color: var(--danger); }
.kpi-card.kpi-ok { border-top-color: var(--ok); }
.kpi-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}
.kpi-value {
  font-size: 20px;
  font-weight: 700;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.kpi-meta {
  font-size: 11.5px;
  color: var(--text-light);
  margin-top: 3px;
}

.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  margin-bottom: 14px;
}
.panel-head {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.panel-title { margin: 0; font-size: 13.5px; font-weight: 700; }
.panel-body { padding: 14px; }

/* Filter Bar */
.filter-bar {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  padding: 10px 12px;
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
}
.filter-group {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 120px;
}
.filter-group.filter-grow { flex: 1; min-width: 200px; }

/* Uniform control height inside filter bars */
.filter-bar .form-input,
.filter-bar .form-select,
.filter-bar .btn,
.filter-bar .filter-check {
  height: 32px;
  box-sizing: border-box;
}
.filter-bar .form-input,
.filter-bar .form-select {
  padding-top: 0;
  padding-bottom: 0;
  line-height: 30px;
}
.filter-bar .btn {
  padding: 0 12px;
  font-size: 12px;
  line-height: 1;
}
.filter-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-main);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.filter-check input { margin: 0; }

/* Forms */
.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.form-label { font-size: 11.5px; font-weight: 600; color: var(--text-main); }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 6px 8px;
  font-size: 12.5px;
  font-family: inherit;
  border: 1px solid var(--border-strong);
  background: #ffffff;
  color: var(--text-main);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: 2px solid #93c5fd;
  border-color: var(--primary);
}
.form-input:disabled, .form-select:disabled, .form-textarea:disabled {
  background: #f1f5f9;
  color: #64748b;
  cursor: not-allowed;
}
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* Tables */
.tbl-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  overflow-x: auto;
}
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.tbl-th {
  background: #f8fafc;
  border-bottom: 2px solid var(--border-strong);
  padding: 8px 10px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}
.tbl-th.num { text-align: right; }
.tbl-td {
  border-bottom: 1px solid #e2e8f0;
  padding: 7px 10px;
  vertical-align: top;
}
.tbl-row:hover { background: #f8fafc; }
.tbl-row.is-clickable { cursor: pointer; }
.tbl-row.row-variance { background: #fffbeb; }

/* Status Badges */
.status-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  border: 1px solid var(--border-color);
  background: #f1f5f9;
  color: var(--text-main);
  white-space: nowrap;
}
.badge-ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); }
.badge-warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
.badge-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
.badge-info { background: var(--info-bg); border-color: var(--info-border); color: var(--info); }

/* Pure CSS Bars */
.bar-list { display: flex; flex-direction: column; gap: 8px; }
.bar-item-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.bar-track { height: 8px; background: #e2e8f0; width: 100%; }
.bar-fill { height: 100%; background: var(--primary); }

/* Slide-Over Drawer */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  z-index: 100;
  display: flex;
  justify-content: flex-end;
}
.drawer {
  width: 100%;
  max-width: 720px;
  height: 100%;
  background: var(--bg-page);
  border-left: 1px solid var(--border-strong);
  display: flex;
  flex-direction: column;
}
.drawer-head {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
}
.drawer-foot {
  background: var(--bg-surface);
  border-top: 1px solid var(--border-color);
  padding: 10px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.section-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  margin-bottom: 12px;
}
.section-card.is-locked { opacity: 0.85; background: #f8fafc; }
.section-card-head {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.sec-hr { border-left: 4px solid #1d4ed8; }
.sec-bank { border-left: 4px solid #047857; }
.sec-check { border-left: 4px solid #b45309; }
.section-card-body { padding: 12px; }

/* Modal */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  z-index: 120;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-card {
  width: 100%;
  max-width: 640px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  padding: 18px;
}

/* Toasts */
.toast-stack {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}
.toast {
  padding: 10px 14px;
  border: 1px solid var(--border-strong);
  background: var(--bg-sidebar);
  color: #ffffff;
  font-size: 12.5px;
  font-weight: 500;
}
.toast-ok { background: #14532d; border-color: #166534; }
.toast-error { background: #7f1d1d; border-color: #991b1b; }

.banner-alert {
  padding: 10px 12px;
  border: 1px solid var(--warn-border);
  background: var(--warn-bg);
  color: #92400e;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
}

/* Pagination Bar */
.pagination-bar {
  background: var(--bg-subtle);
  border-top: 1px solid var(--border-color);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.pagination-info {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.pagination-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.pagination-size {
  padding: 4px 6px;
  font-size: 12px;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-main);
}
.pagination-page-label {
  font-size: 12px;
  font-weight: 600;
  padding: 0 6px;
  font-variant-numeric: tabular-nums;
}

/* Global Loading Indicators & Navbar Sign Out */
.btn-outline-danger {
  border-color: var(--danger-border);
  color: var(--danger);
  background: var(--danger-bg);
}
.btn-outline-danger:hover {
  background: #fee2e2;
  border-color: #fca5a5;
}
.top-loading-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 250;
  background: #dbeafe;
  overflow: hidden;
}
.top-loading-bar-inner {
  width: 35%;
  height: 100%;
  background: var(--primary);
  animation: top-bar-slide 1.1s ease-in-out infinite;
}
@keyframes top-bar-slide {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(390%); }
}
.loading-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 9px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  white-space: nowrap;
}
.loading-pill.is-loading {
  color: var(--primary);
  background: var(--info-bg);
  border-color: var(--info-border);
}
.spinner {
  width: 12px;
  height: 12px;
  border: 2px solid #cbd5e1;
  border-top-color: #64748b;
  border-radius: 50% !important;
  display: inline-block;
  animation: none;
}
.loading-pill.is-loading .spinner {
  border-color: #bfdbfe;
  border-top-color: var(--primary);
  animation: spin 0.7s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
