<script>
(function() {
  var TOKEN_KEY = 'sss_ins_session_token';
  var state = {
    token: sessionStorage.getItem(TOKEN_KEY) || '',
    user: null,
    permissions: null,
    masters: { items: [], grouped: {} },
    rawSheets: [],
    activeView: 'dashboard',
    cache: {},
    dashboard: null,
    dashFilters: { year: '', client: '' },
    alertsPage: { page: 1, pageSize: 10 },
    sssData: { items: [], totals: {}, pagination: null },
    sssFilters: { year: '', month: '', client: '', benefitType: '', bankStatus: '', stage: '', varianceOnly: false, search: '', page: 1, pageSize: 25 },
    insData: { items: [], totals: {}, pagination: null },
    insFilters: { year: '', client: '', expenseBearer: '', bankStatus: '', stage: '', openBalanceOnly: false, search: '', page: 1, pageSize: 25 },
    empQuery: '',
    empResults: null,
    empPage: { page: 1, pageSize: 10 },
    importPreview: null,
    impPage: { page: 1, pageSize: 25, anomaliesOnly: false },
    usersList: [],
    usersPage: { page: 1, pageSize: 15 },
    mastersPage: { page: 1, pageSize: 15, category: '' },
    auditData: { items: [], pagination: null },
    auditFilters: { module: '', search: '', page: 1, pageSize: 25 },
    profileAuditPage: { page: 1, pageSize: 10 },
    profileHandlersBound: false
  };

  var debounceTimers = {};
  function debounceRun(key, fn, delay) {
    if (debounceTimers[key]) clearTimeout(debounceTimers[key]);
    debounceTimers[key] = setTimeout(fn, delay || 300);
  }

  function invalidateClientCache() {
    state.cache = {};
  }

  var pendingRequests = 0;

  function updateGlobalLoadingUi() {
    var active = pendingRequests > 0;
    var bar = document.getElementById('top-loading-bar');
    var pill = document.getElementById('header-loading-indicator');
    var label = document.getElementById('header-loading-label');
    var refreshBtn = document.getElementById('btn-refresh');
    if (bar) bar.classList.toggle('hidden', !active);
    if (pill) pill.classList.toggle('is-loading', active);
    if (label) label.textContent = active ? 'Loading...' : 'Ready';
    if (refreshBtn) setBtnLoading(refreshBtn, active, 'Refreshing...', 'Refresh');
  }

  function beginGlobalLoading() {
    pendingRequests++;
    updateGlobalLoadingUi();
  }

  function endGlobalLoading() {
    pendingRequests = Math.max(0, pendingRequests - 1);
    updateGlobalLoadingUi();
  }

  function callApi(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('Google Apps Script runtime unavailable.'));
        return;
      }
      beginGlobalLoading();
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          endGlobalLoading();
          if (res && res.ok) resolve(res.data);
          else reject(new Error((res && res.error) ? res.error : 'Unknown server error'));
        })
        .withFailureHandler(function(err) {
          endGlobalLoading();
          reject(new Error(err && err.message ? err.message : String(err)));
        });
      runner[fnName].apply(runner, args);
    });
  }

  function esc(val) {
    return String(val === null || val === undefined ? '' : val)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fmtPhp(val) {
    if (val === '' || val === null || val === undefined || isNaN(Number(val))) return '—';
    return '₱' + Number(val).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function toast(msg, kind) {
    var stack = document.getElementById('toast-stack');
    var el = document.createElement('div');
    el.className = 'toast ' + (kind === 'error' ? 'toast-error' : (kind === 'ok' ? 'toast-ok' : ''));
    el.textContent = msg;
    stack.appendChild(el);
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 4200);
  }

  function setBtnLoading(btn, isLoading, loadingLabel, defaultLabel) {
    if (!btn) return;
    btn.disabled = isLoading;
    var span = btn.querySelector('[data-btn-label]');
    if (span) span.textContent = isLoading ? loadingLabel : defaultLabel;
    else btn.textContent = isLoading ? loadingLabel : defaultLabel;
  }

  function stageBadge(stage) {
    var s = String(stage || '');
    var cls = 'status-badge';
    if (s === 'COMPLETED' || s === 'DONE') cls += ' badge-ok';
    else if (s === 'VARIANCE_FLAGGED' || s === 'DISALLOWED_BALANCE') cls += ' badge-danger';
    else if (s === 'ADVANCED_AWAITING_SSS' || s === 'PENDING_BANK') cls += ' badge-warn';
    else if (s === 'CREDITED_AWAITING_CHECK' || s === 'CREDITED') cls += ' badge-info';
    return '<span class="' + cls + '">' + esc(s.replace(/_/g, ' ')) + '</span>';
  }

  function masterOptions(category, selected, includeAllLabel) {
    var list = (state.masters.grouped && state.masters.grouped[category]) ? state.masters.grouped[category] : [];
    var html = includeAllLabel ? '<option value="">' + esc(includeAllLabel) + '</option>' : '';
    var found = false;
    for (var i = 0; i < list.length; i++) {
      var val = category === 'CLIENT' ? list[i].label : (category === 'BANK' ? list[i].label : list[i].code);
      var lbl = list[i].label;
      if (String(selected) === String(val)) found = true;
      html += '<option value="' + esc(val) + '"' + (String(selected) === String(val) ? ' selected' : '') + '>' + esc(lbl) + '</option>';
    }
    if (selected && !found && includeAllLabel !== undefined) {
      html += '<option value="' + esc(selected) + '" selected>' + esc(selected) + '</option>';
    }
    return html;
  }

  // ==================== REUSABLE PAGINATION HELPERS ====================
  function sliceClientPage(list, page, pageSize) {
    var totalItems = list.length;
    var size = parseInt(pageSize, 10) || 25;
    var totalPages = Math.max(1, Math.ceil(totalItems / size));
    var pg = Math.min(Math.max(parseInt(page, 10) || 1, 1), totalPages);
    var startIdx = (pg - 1) * size;
    var items = list.slice(startIdx, startIdx + size);
    return {
      items: items,
      pagination: {
        page: pg,
        pageSize: size,
        totalItems: totalItems,
        totalPages: totalPages,
        startRow: totalItems ? startIdx + 1 : 0,
        endRow: startIdx + items.length
      }
    };
  }

  function renderPaginationBar(pg, prefix, sizeOptions) {
    if (!pg) return '';
    var sizes = sizeOptions || [10, 25, 50, 100];
    var sizeOptsHtml = sizes.map(function(sz) {
      return '<option value="' + sz + '"' + (Number(pg.pageSize) === sz ? ' selected' : '') + '>' + sz + ' / page</option>';
    }).join('');
    return '<div class="pagination-bar" data-pg-bar="' + esc(prefix) + '">' +
      '<div class="pagination-info">Showing <strong>' + pg.startRow + '–' + pg.endRow + '</strong> of <strong>' + pg.totalItems + '</strong></div>' +
      '<div class="pagination-controls">' +
        '<select class="pagination-size" data-pg-size="' + esc(prefix) + '">' + sizeOptsHtml + '</select>' +
        '<button type="button" class="btn btn-sm" data-pg-nav="' + esc(prefix) + ':first" ' + (pg.page <= 1 ? 'disabled' : '') + '>First</button>' +
        '<button type="button" class="btn btn-sm" data-pg-nav="' + esc(prefix) + ':prev" ' + (pg.page <= 1 ? 'disabled' : '') + '>Prev</button>' +
        '<span class="pagination-page-label">Page ' + pg.page + ' / ' + pg.totalPages + '</span>' +
        '<button type="button" class="btn btn-sm" data-pg-nav="' + esc(prefix) + ':next" ' + (pg.page >= pg.totalPages ? 'disabled' : '') + '>Next</button>' +
        '<button type="button" class="btn btn-sm" data-pg-nav="' + esc(prefix) + ':last" ' + (pg.page >= pg.totalPages ? 'disabled' : '') + '>Last</button>' +
      '</div>' +
    '</div>';
  }

  function bindPaginationBar(prefix, currentPg, onPageChange, onSizeChange) {
    if (!currentPg) return;
    var sizeEl = document.querySelector('[data-pg-size="' + prefix + '"]');
    if (sizeEl) {
      sizeEl.addEventListener('change', function() {
        onSizeChange(parseInt(sizeEl.value, 10) || 25);
      });
    }
    document.querySelectorAll('[data-pg-nav^="' + prefix + ':"]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var action = btn.getAttribute('data-pg-nav').split(':')[1];
        var nextPage = currentPg.page;
        if (action === 'first') nextPage = 1;
        else if (action === 'prev') nextPage = Math.max(1, currentPg.page - 1);
        else if (action === 'next') nextPage = Math.min(currentPg.totalPages, currentPg.page + 1);
        else if (action === 'last') nextPage = currentPg.totalPages;
        if (nextPage !== currentPg.page) onPageChange(nextPage);
      });
    });
  }

  function getUserInitials(name, username) {
    var src = String(name || username || 'U').trim();
    var parts = src.split(/\s+/).filter(Boolean);
    if (parts.length >= 2) {
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }
    return src.slice(0, 2).toUpperCase();
  }

  function renderAvatarElements(imgId, initId, user) {
    var imgEl = document.getElementById(imgId);
    var initEl = document.getElementById(initId);
    if (!imgEl || !initEl) return;
    var photo = user && user.photo_data ? String(user.photo_data) : '';
    if (photo) {
      imgEl.src = photo;
      imgEl.classList.remove('hidden');
      initEl.classList.add('hidden');
    } else {
      imgEl.removeAttribute('src');
      imgEl.classList.add('hidden');
      initEl.textContent = getUserInitials(user && user.full_name, user && user.username);
      initEl.classList.remove('hidden');
    }
  }

  function renderSidebarUser() {
    if (!state.user) return;
    var nameEl = document.getElementById('sidebar-user-name');
    var roleEl = document.getElementById('sidebar-user-role');
    if (nameEl) nameEl.textContent = state.user.full_name || state.user.username;
    if (roleEl) roleEl.textContent = state.user.role_label || state.user.role;
    renderAvatarElements('sidebar-avatar-img', 'sidebar-avatar-initials', state.user);
  }

  function initStaticIcons() {
    var iconMap = [
      ['login-info-icon', 'alert', 'sm'],
      ['login-btn-icon', 'login', 'sm'],
      ['prof-upload-icon', 'upload', 'sm'],
      ['prof-remove-icon', 'trash', 'sm'],
      ['prof-logout-icon', 'logout', 'sm'],
      ['header-logout-icon', 'logout', 'sm'],
      ['prof-save-icon', 'check', 'sm'],
      ['prof-lock-icon', 'lock', 'sm']
    ];
    for (var i = 0; i < iconMap.length; i++) {
      var el = document.getElementById(iconMap[i][0]);
      if (el) el.innerHTML = renderIcon(iconMap[i][1], iconMap[i][2]);
    }
  }

  function resolveInitialView() {
    var valid = { dashboard: 1, sss: 1, insurance: 1, employees: 1, import: 1, admin: 1, audit: 1, profile: 1 };
    var p = (window.__INITIAL_PAGE__ || '').toLowerCase();
    if (!p && window.location && window.location.search) {
      try {
        p = (new URLSearchParams(window.location.search).get('page') || '').toLowerCase();
      } catch (e) {}
    }
    if (valid[p]) state.activeView = p;
  }

  function bootstrap() {
    initStaticIcons();
    resolveInitialView();
    if (!state.token) {
      showLogin();
      return;
    }
    callApi('apiBootstrap', state.token).then(function(res) {
      if (!res.authenticated) {
        state.token = '';
        sessionStorage.removeItem(TOKEN_KEY);
        showLogin();
        return;
      }
      state.user = res.user;
      state.permissions = res.permissions;
      state.masters = res.masters || { items: [], grouped: {} };
      state.rawSheets = res.rawSheets || [];
      showApp();
      if (state.user.must_change_password) {
        openPasswordModal(true);
      }
    }).catch(function(err) {
      toast(err.message, 'error');
      showLogin();
    });
  }

  function showLogin() {
    document.getElementById('app-shell').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
  }

  function showApp() {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-shell').classList.remove('hidden');
    renderSidebarUser();
    renderSidebar();
    navigate(state.activeView, true);
  }

  function renderSidebar() {
    var navItems = [
      { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', section: 'Monitoring' },
      { id: 'sss', label: 'SSS Monitoring', icon: 'clipboard', section: 'Monitoring' },
      { id: 'insurance', label: 'Insurance & Accident', icon: 'shield', section: 'Monitoring' },
      { id: 'employees', label: 'Employee Lookup', icon: 'users', section: 'Monitoring' },
      { id: 'import', label: 'Import & Reports', icon: 'upload', section: 'Operations', show: state.permissions.canImport || true },
      { id: 'admin', label: 'Master Lists & Users', icon: 'settings', section: 'Administration', show: state.permissions.canManageUsers },
      { id: 'audit', label: 'Audit Log', icon: 'history', section: 'Administration' }
    ];
    var html = '';
    var lastSec = '';
    for (var i = 0; i < navItems.length; i++) {
      var it = navItems[i];
      if (it.show === false) continue;
      if (it.section !== lastSec) {
        html += '<div class="sidebar-nav-label">' + esc(it.section) + '</div>';
        lastSec = it.section;
      }
      html += '<button type="button" class="sidebar-nav-link ' + (state.activeView === it.id ? 'is-active' : '') +
        '" data-nav="' + it.id + '">' + renderIcon(it.icon, 'md') + '<span>' + esc(it.label) + '</span></button>';
    }
    var nav = document.getElementById('sidebar-nav');
    nav.innerHTML = html;
    nav.querySelectorAll('[data-nav]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        navigate(btn.getAttribute('data-nav'));
      });
    });
    var userCard = document.getElementById('sidebar-user-card');
    if (userCard) userCard.classList.toggle('is-active', state.activeView === 'profile');
  }

  function navigate(viewId, skipPush) {
    if (viewId === 'admin' && state.permissions && !state.permissions.canManageUsers) {
      viewId = 'dashboard';
    }
    state.activeView = viewId;
    renderSidebar();
    var titles = {
      dashboard: ['Executive Monitoring Dashboard', 'Real-time PHP exposure, aging alerts, and departmental progress'],
      sss: ['SSS Sickness, Maternity & EC Claims', 'HR Filing → Bank Crediting → Check Issuance workflow'],
      insurance: ['Insurance & Accident Monitoring', 'Work-related accident reimbursements and disallowance tracking'],
      employees: ['Unified Employee Lookup', 'Combined SSS & Insurance history across all clients'],
      import: ['Legacy Import & CSV Reports', 'Parse 2025/2026 SSS & Insurance sheets with anomaly checks'],
      admin: ['Master Lists & User Accounts', 'Manage Clients, Banks, ERIDs, and Department Role access'],
      audit: ['System Audit Log', 'Immutable record of departmental updates and field changes'],
      profile: ['My Profile', 'Manage your profile picture, account details, password, and session']
    };
    var t = titles[viewId] || ['Monitoring', ''];
    document.getElementById('page-title').textContent = t[0];
    document.getElementById('page-subtitle').textContent = t[1];

    var viewRoot = document.getElementById('view-root');
    var profileRoot = document.getElementById('profile-root');
    if (viewRoot) viewRoot.classList.toggle('hidden', viewId === 'profile');
    if (profileRoot) profileRoot.classList.toggle('hidden', viewId !== 'profile');

    if (!skipPush && window.history && typeof window.history.pushState === 'function') {
      try {
        var nextUrl = '?page=' + encodeURIComponent(viewId);
        window.history.pushState({ viewId: viewId }, '', nextUrl);
      } catch (e) {}
    }

    if (viewId === 'dashboard') loadDashboard();
    else if (viewId === 'sss') loadSss();
    else if (viewId === 'insurance') loadInsurance();
    else if (viewId === 'employees') renderEmployeesView();
    else if (viewId === 'import') renderImportView();
    else if (viewId === 'admin') loadAdminView();
    else if (viewId === 'audit') loadAuditView();
    else if (viewId === 'profile') loadProfileView();
  }

  // ==================== DASHBOARD ====================
  function loadDashboard(forceReload) {
    var filters = state.dashFilters;
    var cacheKey = 'dash:' + JSON.stringify(filters);
    if (!forceReload && state.cache[cacheKey]) {
      state.dashboard = state.cache[cacheKey];
      renderDashboard(filters);
      return;
    }
    var root = document.getElementById('view-root');
    root.innerHTML = '<div class="panel"><div class="panel-body">Loading dashboard metrics...</div></div>';
    callApi('apiGetDashboard', state.token, filters).then(function(data) {
      state.cache[cacheKey] = data;
      state.dashboard = data;
      renderDashboard(filters);
    }).catch(function(err) {
      root.innerHTML = '<div class="auth-alert auth-alert-error">' + esc(err.message) + '</div>';
    });
  }

  function renderDashboard(filters) {
    var d = state.dashboard;
    var s = d.sss;
    var ins = d.insurance;
    var pagedAlerts = sliceClientPage(d.agingAlerts || [], state.alertsPage.page, state.alertsPage.pageSize);
    state.alertsPage.page = pagedAlerts.pagination.page;
    var html = '';

    html += '<div class="filter-bar">' +
      '<div class="filter-group"><label class="form-label">Year</label>' +
        '<select id="dash-year" class="form-select"><option value="">All Years</option>' +
        '<option value="2026"' + (filters.year === '2026' ? ' selected' : '') + '>2026</option>' +
        '<option value="2025"' + (filters.year === '2025' ? ' selected' : '') + '>2025</option></select></div>' +
      '<div class="filter-group"><label class="form-label">Client / Project</label>' +
        '<select id="dash-client" class="form-select">' + masterOptions('CLIENT', filters.client, 'All Clients') + '</select></div>' +
      '<button id="dash-apply-btn" type="button" class="btn btn-primary btn-sm">Apply</button>' +
    '</div>';

    html += '<div class="kpi-grid">' +
      '<div class="kpi-card"><div class="kpi-label">SSS Total Approved</div><div class="kpi-value">' + fmtPhp(s.totalApprovedAmount) + '</div><div class="kpi-meta">' + s.totalClaims + ' claims (' + s.completedCount + ' completed)</div></div>' +
      '<div class="kpi-card kpi-warn"><div class="kpi-label">Pending SSS Bank Credit</div><div class="kpi-value">' + fmtPhp(s.pendingBankAmount) + '</div><div class="kpi-meta">' + s.pendingBankCount + ' claims awaiting SSS credit</div></div>' +
      '<div class="kpi-card kpi-warn"><div class="kpi-label">Pending Check Issuance</div><div class="kpi-value">' + fmtPhp(s.pendingCheckAmount) + '</div><div class="kpi-meta">' + s.pendingCheckCount + ' claims without check</div></div>' +
      '<div class="kpi-card kpi-danger"><div class="kpi-label">Advanced Cash Exposure</div><div class="kpi-value">' + fmtPhp(s.advancedExposureAmount) + '</div><div class="kpi-meta">' + s.advancedExposureCount + ' checks released before SSS credit</div></div>' +
      '<div class="kpi-card kpi-ok"><div class="kpi-label">Insurance Released</div><div class="kpi-value">' + fmtPhp(ins.totalReleasedAmount) + '</div><div class="kpi-meta">' + ins.totalClaims + ' cases (Reimbursed: ' + fmtPhp(ins.totalReimbursedAmount) + ')</div></div>' +
      '<div class="kpi-card kpi-danger"><div class="kpi-label">Insurance Disallowed / Open Bal</div><div class="kpi-value">' + fmtPhp(ins.disallowedBalanceAmount) + '</div><div class="kpi-meta">' + ins.disallowedBalanceCount + ' cases with variance | ' + ins.pendingReimbursementCount + ' pending bank</div></div>' +
    '</div>';

    // Aging Alerts (Paginated)
    html += '<div class="panel"><div class="panel-head"><h3 class="panel-title">Aging Alerts (&gt;30d Bank Credit / &gt;14d Check Issuance)</h3>' +
      '<span class="status-badge ' + (d.totalAgingAlertsCount ? 'badge-danger' : 'badge-ok') + '">' + d.totalAgingAlertsCount + ' Overdue</span></div>';
    if (d.agingAlerts.length === 0) {
      html += '<div class="panel-body muted">No overdue claims found under current filters.</div>';
    } else {
      html += '<div class="tbl-wrap" style="border:none;"><table class="tbl"><thead><tr>' +
        '<th class="tbl-th">Module</th><th class="tbl-th">Employee</th><th class="tbl-th">Client</th>' +
        '<th class="tbl-th">Ref No.</th><th class="tbl-th">Alert</th><th class="tbl-th num">Days</th><th class="tbl-th num">Amount</th>' +
        '</tr></thead><tbody>';
      for (var i = 0; i < pagedAlerts.items.length; i++) {
        var al = pagedAlerts.items[i];
        html += '<tr class="tbl-row is-clickable" data-alert-mod="' + esc(al.module) + '" data-alert-id="' + esc(al.id) + '">' +
          '<td class="tbl-td"><span class="status-badge">' + esc(al.module) + '</span></td>' +
          '<td class="tbl-td fw-600">' + esc(al.employee_name) + '</td>' +
          '<td class="tbl-td">' + esc(al.client) + '</td>' +
          '<td class="tbl-td mono">' + esc(al.ref_no) + '</td>' +
          '<td class="tbl-td"><span class="status-badge badge-danger">' + esc(al.alert_type.replace(/_/g, ' ')) + '</span></td>' +
          '<td class="tbl-td num fw-600">' + al.days_aged + 'd</td>' +
          '<td class="tbl-td num">' + fmtPhp(al.amount) + '</td></tr>';
      }
      html += '</tbody></table></div>' + renderPaginationBar(pagedAlerts.pagination, 'alerts', [10, 25, 50]);
    }
    html += '</div>';

    html += '<div class="dash-grid">' +
      renderBarPanel('Top Clients / Projects (PHP)', d.breakdowns.byClient.slice(0, 10)) +
      renderBarPanel('Bank & Benefit Distribution (PHP)', d.breakdowns.byBank.concat(d.breakdowns.byBenefit)) +
    '</div>';

    document.getElementById('view-root').innerHTML = html;
    document.getElementById('dash-apply-btn').addEventListener('click', function() {
      state.dashFilters.year = document.getElementById('dash-year').value;
      state.dashFilters.client = document.getElementById('dash-client').value;
      state.alertsPage.page = 1;
      loadDashboard(true);
    });
    bindPaginationBar('alerts', pagedAlerts.pagination, function(pg) {
      state.alertsPage.page = pg;
      renderDashboard(filters);
    }, function(sz) {
      state.alertsPage.pageSize = sz;
      state.alertsPage.page = 1;
      renderDashboard(filters);
    });
    document.querySelectorAll('[data-alert-id]').forEach(function(row) {
      row.addEventListener('click', function() {
        var mod = row.getAttribute('data-alert-mod');
        var id = row.getAttribute('data-alert-id');
        openClaimById(mod, id);
      });
    });
  }

  function renderBarPanel(title, list) {
    var maxAmt = 1;
    for (var i = 0; i < list.length; i++) {
      if (list[i].amount > maxAmt) maxAmt = list[i].amount;
    }
    var body = '';
    if (!list.length) {
      body = '<div class="muted">No data yet.</div>';
    } else {
      body = '<div class="bar-list">';
      for (var j = 0; j < list.length; j++) {
        var pct = Math.max(2, Math.round((list[j].amount / maxAmt) * 100));
        body += '<div><div class="bar-item-head"><span><strong>' + esc(list[j].key) + '</strong> <span class="muted">(' + list[j].count + ')</span></span>' +
          '<span class="num fw-600">' + fmtPhp(list[j].amount) + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;"></div></div></div>';
      }
      body += '</div>';
    }
    return '<div class="panel"><div class="panel-head"><h3 class="panel-title">' + esc(title) + '</h3></div><div class="panel-body">' + body + '</div></div>';
  }

  function openClaimById(mod, id) {
    if (mod === 'SSS') {
      callApi('apiGetSssById', state.token, id).then(function(rec) {
        if (rec) openSssDrawer(rec);

  // ==================== SSS MONITORING ====================
  function loadSss(forceReload) {
    var cacheKey = 'sss:' + JSON.stringify(state.sssFilters);
    if (!forceReload && state.cache[cacheKey]) {
      state.sssData = state.cache[cacheKey];
      renderSssView();
      return;
    }
    var root = document.getElementById('view-root');
    root.innerHTML = '<div class="panel"><div class="panel-body">Loading SSS claims...</div></div>';
    callApi('apiListSss', state.token, state.sssFilters).then(function(res) {
      state.cache[cacheKey] = res;
      state.sssData = res;
      state.sssFilters.page = res.pagination ? res.pagination.page : 1;
      renderSssView();
    }).catch(function(err) {
      root.innerHTML = '<div class="auth-alert auth-alert-error">' + esc(err.message) + '</div>';
    });
  }

    function applySssFilters() {
      state.sssFilters.search = document.getElementById('sss-f-search').value;

    function updateVariancePreview() {
      var form = document.getElementById('sss-drawer-form');
      var rel = Number(form.amount_to_release.value);
      var cred = form.amount_credited.value !== '' ? Number(form.amount_credited.value) : null;
      var chk = form.check_amount.value !== '' ? Number(form.check_amount.value) : null;
      var msgs = [];
      if (cred !== null && Math.abs(rel - cred) > 0.009) msgs.push('Bank Variance: ' + fmtPhp(rel - cred));
      if (chk !== null && Math.abs(rel - chk) > 0.009) msgs.push('Check Variance: ' + fmtPhp(rel - chk));
      var el = document.getElementById('sss-live-variance');
      if (msgs.length) {
        el.innerHTML = renderIcon('alert', 'sm') + '<span><strong>Variance Warning:</strong> ' + esc(msgs.join(' | ')) + '</span>';
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }

  function loadInsurance(forceReload) {
    var cacheKey = 'ins:' + JSON.stringify(state.insFilters);
    if (!forceReload && state.cache[cacheKey]) {
      state.insData = state.cache[cacheKey];
      renderInsuranceView();
      return;
    }
    var root = document.getElementById('view-root');
    root.innerHTML = '<div class="panel"><div class="panel-body">Loading Insurance claims...</div></div>';
    callApi('apiListInsurance', state.token, state.insFilters).then(function(res) {
      state.cache[cacheKey] = res;
      state.insData = res;
      state.insFilters.page = res.pagination ? res.pagination.page : 1;
      renderInsuranceView();
    }).catch(function(err) {
      root.innerHTML = '<div class="auth-alert auth-alert-error">' + esc(err.message) + '</div>';
    });

    function applyInsFilters() {
      state.insFilters.search = document.getElementById('ins-f-search').value;
      state.insFilters.client = document.getElementById('ins-f-client').value;
      state.insFilters.expenseBearer = document.getElementById('ins-f-bearer').value;
      state.insFilters.stage = document.getElementById('ins-f-stage').value;
      state.insFilters.openBalanceOnly = document.getElementById('ins-f-bal').checked;
      state.insFilters.page = 1;
      loadInsurance();
    }

    document.getElementById('ins-f-apply').addEventListener('click', applyInsFilters);
    document.getElementById('ins-f-search').addEventListener('input', function() {
      debounceRun('ins-search', function() {
        var el = document.getElementById('ins-f-search');
        if (el) {
          state.insFilters.search = el.value;
          state.insFilters.page = 1;
          loadInsurance();
        }

    document.getElementById('ins-f-search').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') applyInsFilters();
    });
    ['ins-f-client', 'ins-f-bearer', 'ins-f-stage', 'ins-f-bal'].forEach(function(id) {
      document.getElementById(id).addEventListener('change', applyInsFilters);
    });

    bindPaginationBar('ins', pg, function(nextPage) {
      state.insFilters.page = nextPage;
      loadInsurance();
    }, function(nextSize) {
      state.insFilters.pageSize = nextSize;
      state.insFilters.page = 1;

    document.getElementById('ins-export-btn').addEventListener('click', function() {

    });
    document.querySelectorAll('[data-ins-id]').forEach(function(row) {

        var id = row.getAttribute('data-ins-id');
        var rec = state.insData.items.find(function(x) { return x.id === id; });
        if (rec) openInsuranceDrawer(rec);
      });
    });
  }

      expense_bearer: 'COMPANY EXPENSE', client_assigned: 'VMC', insurance_ref_no: '',

            '<div class="form-group"><label class="form-label">Client Assigned</label><select name="client_assigned" class="form-select" ' + (!hrEditable ? 'disabled' : '') + '>' + masterOptions('CLIENT', r.client_assigned, '') + '</select></div>' +

          '<div class="form-grid-3">' +
            '<div class="form-group"><label class="form-label">Date of Accident</label><input name="date_of_accident" type="date" class="form-input" value="' + esc(r.date_of_accident) + '" ' + (!hrEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Accident Type</label><select name="accident_type" class="form-select" ' + (!hrEditable ? 'disabled' : '') + '>' + masterOptions('ACCIDENT_TYPE', r.accident_type) + '</select></div>' +
            '<div class="form-group"><label class="form-label">Expense Bearer</label><select name="expense_bearer" class="form-select" ' + (!hrEditable ? 'disabled' : '') + '>' + masterOptions('EXPENSE_BEARER', r.expense_bearer) + '</select></div>' +
          '</div>' +
          '<div class="form-grid-3">' +
            '<div class="form-group"><label class="form-label">Insurance Ref (SIIP-ANHDA-...)</label><input name="insurance_ref_no" class="form-input mono" value="' + esc(r.insurance_ref_no) + '" ' + (!hrEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Date of Submission</label><input name="date_of_submission" type="date" class="form-input" value="' + esc(r.date_of_submission) + '" ' + (!hrEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Amount Released (PHP)</label><input name="amount_released" type="number" step="0.01" min="0" class="form-input" value="' + esc(r.amount_released) + '" ' + (!hrEditable ? 'disabled' : 'required') + '/></div>' +
          '</div>' +
          '<div class="form-grid-2">' +
            '<div class="form-group"><label class="form-label">Reimbursed Date</label><input name="reimbursed_date" type="date" class="form-input" value="' + esc(r.reimbursed_date) + '" ' + (!hrEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Amount Reimbursed (PHP)</label><input name="amount_reimbursed" type="number" step="0.01" class="form-input" value="' + esc(r.amount_reimbursed) + '" ' + (!hrEditable ? 'disabled' : '') + '/></div>' +

          '<div class="form-grid-3">' +
            '<div class="form-group"><label class="form-label">Date of Check</label><input name="date_of_check" type="date" class="form-input" value="' + esc(r.date_of_check) + '" ' + (!checkEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Check Amount (PHP)</label><input name="check_amount" type="number" step="0.01" class="form-input" value="' + esc(r.check_amount) + '" ' + (!checkEditable ? 'disabled' : '') + '/></div>' +
            '<div class="form-group"><label class="form-label">Check #</label><input name="check_no" class="form-input mono" value="' + esc(r.check_no) + '" ' + (!checkEditable ? 'disabled' : '') + '/></div>' +

      (!isCreate && state.permissions.canDelete
        ? '<button id="ins-delete-btn" type="button" class="btn btn-danger btn-sm">' + renderIcon('trash', 'sm') + '<span data-btn-label>Delete</span></button>'
        : '') +
      '</div><div style="display:flex;gap:8px;">' +
      '<button id="drawer-cancel-btn" type="button" class="btn btn-sm">Cancel</button>' +
      (hrEditable || bankEditable || checkEditable
        ? '<button id="ins-save-btn" type="button" class="btn btn-primary btn-sm">' + renderIcon('check', 'sm') + '<span data-btn-label>Save Claim</span></button>'
        : '') +
      '</div>';

    openDrawer(body, foot);

    var form = document.getElementById('ins-drawer-form');
    function syncCheckFields() {
      var bearer = form.expense_bearer.value;
      if (hrEditable && isCreate) {
        form.check_required.checked = (bearer === 'EMPLOYEE EXPENSE');
      }
      var req = form.check_required.checked;
      if (!req && checkEditable) {
        form.date_of_check.disabled = true;
        form.check_amount.disabled = true;
        form.check_no.disabled = true;
      } else if (checkEditable) {
        form.date_of_check.disabled = false;
        form.check_amount.disabled = false;
        form.check_no.disabled = false;
      }
      var rel = Number(form.amount_released.value) || 0;
      var reimb = form.amount_reimbursed.value !== '' ? Number(form.amount_reimbursed.value) : 0;
      var bal = rel - reimb;
      var el = document.getElementById('ins-live-balance');
      if (rel > 0 && Math.abs(bal) > 0.009) {
        el.innerHTML = renderIcon('alert', 'sm') + '<span><strong>Balance / Variance:</strong> ' + fmtPhp(bal) + ' (Released − Reimbursed)</span>';
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    }
    syncCheckFields();
    form.addEventListener('input', syncCheckFields);
    form.addEventListener('change', syncCheckFields);

    var saveBtn = document.getElementById('ins-save-btn');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        var payload = isCreate ? {} : { id: r.id };
        var fields = ['employee_name', 'client_assigned', 'date_of_accident', 'accident_type', 'expense_bearer', 'insurance_ref_no', 'date_of_submission', 'amount_released', 'reimbursed_date', 'amount_reimbursed', 'disallowance_reason', 'hr_remarks', 'bank_status', 'date_credited', 'amount_credited', 'bank_notes', 'date_of_check', 'check_amount', 'check_no', 'final_status', 'check_notes'];
        fields.forEach(function(fn) {
          if (form[fn] && !form[fn].disabled) payload[fn] = form[fn].value;
        });
        if (form.check_required && !form.check_required.disabled) {
          payload.check_required = form.check_required.checked;
        }
        setBtnLoading(saveBtn, true, 'Saving...', 'Save Claim');
        callApi('apiSaveInsurance', state.token, payload).then(function(res) {
          closeDrawer();
          invalidateClientCache();
          toast('Insurance claim saved (' + res.record.id + ').', 'ok');
          if (state.activeView === 'dashboard') loadDashboard(true);
          else loadInsurance(true);
        }).catch(function(err) {
          toast(err.message, 'error');
          setBtnLoading(saveBtn, false, 'Saving...', 'Save Claim');
        });
      });
    }

    var delBtn = document.getElementById('ins-delete-btn');
    if (delBtn) {
      delBtn.addEventListener('click', function() {
        if (!confirm('Soft-delete Insurance claim ' + r.id + '?')) return;
        setBtnLoading(delBtn, true, 'Deleting...', 'Delete');
        callApi('apiDeleteInsurance', state.token, r.id).then(function() {
          closeDrawer();
          invalidateClientCache();
          toast('Insurance claim deleted.', 'ok');
          loadInsurance(true);
        }).catch(function(err) {
          toast(err.message, 'error');
          setBtnLoading(delBtn, false, 'Deleting...', 'Delete');
        });
      });
    }
  }

  function renderEmployeesView() {

      '<div class="filter-group filter-grow"><label class="form-label">Search Employee Name, SS Number, or Claim Ref</label>' +
        '<input id="emp-search-input" class="form-input" value="' + esc(state.empQuery) + '" placeholder="e.g. ALGARME, ALOTA, DINSON, 07-1310081-5..." /></div>' +
      '<button id="emp-search-btn" type="button" class="btn btn-primary btn-sm">Lookup History</button>' +
    '</div><div id="emp-results-mount"></div>';
    document.getElementById('view-root').innerHTML = html;

    function runSearch() {
      state.empQuery = document.getElementById('emp-search-input').value.trim();
      if (!state.empQuery) return;
      state.empPage.page = 1;
      document.getElementById('emp-results-mount').innerHTML = '<div class="panel"><div class="panel-body">Searching across SSS &amp; Insurance...</div></div>';
      callApi('apiEmployeeHistory', state.token, state.empQuery).then(function(res) {
        state.empResults = res;
        renderEmployeeResults();
      }).catch(function(err) {
        toast(err.message, 'error');
      });
    }
    document.getElementById('emp-search-btn').addEventListener('click', runSearch);
    document.getElementById('emp-search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') runSearch();
    });
    if (state.empResults) renderEmployeeResults();

  function renderImportPreview() {
    var p = state.importPreview;
    var mount = document.getElementById('imp-preview-mount');
    if (!p) return;

    var indexed = [];
    for (var idx = 0; idx < p.previewRows.length; idx++) {
      var rw = p.previewRows[idx];
      if (state.impPage.anomaliesOnly && (!rw.anomalies || rw.anomalies.length === 0)) continue;
      indexed.push({ origIdx: idx, row: rw });
    }
    var paged = sliceClientPage(indexed, state.impPage.page, state.impPage.pageSize);
    state.impPage.page = paged.pagination.page;

    var rowsHtml = paged.items.map(function(entry) {
      var row = entry.row;
      var rec = row.record;
      var label = p.targetModule === 'SSS' ? (rec.claim_ref_no + ' — ' + rec.employee_name) : ('#' + rec.seq_no + ' — ' + rec.employee_name);
      var amt = p.targetModule === 'SSS' ? fmtPhp(rec.amount_to_release) : fmtPhp(rec.amount_released);
      var anoms = row.anomalies.map(function(a) { return a.code + ': ' + a.message; }).join(' | ');
      return '<tr class="tbl-row ' + (row.anomalies.length ? 'row-variance' : '') + '">' +
        '<td class="tbl-td"><input type="checkbox" data-imp-skip="' + entry.origIdx + '" ' + (!row.skipImport ? 'checked' : '') + ' /></td>' +
        '<td class="tbl-td mono">' + row.sourceLine + ' (' + esc(row.sourceLayout) + ')</td>' +
        '<td class="tbl-td fw-600">' + esc(label) + '</td>' +
        '<td class="tbl-td num">' + amt + '</td>' +
        '<td class="tbl-td">' + stageBadge(rec.workflow_stage) + '</td>' +
        '<td class="tbl-td">' + (anoms ? '<span class="status-badge badge-danger">' + esc(anoms) + '</span>' : '<span class="status-badge badge-ok">CLEAN</span>') + '</td></tr>';
    }).join('');

    mount.innerHTML = '<div class="panel"><div class="panel-head"><h3 class="panel-title">Import Preview (' + p.parsedRowsCount + ' parsed, ' + p.skippedRows + ' skipped, ' + p.anomalyRows + ' anomalies)</h3>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
        '<label class="form-label" style="margin:0;"><input id="imp-anom-only" type="checkbox"' + (state.impPage.anomaliesOnly ? ' checked' : '') + ' /> Anomalies Only</label>' +
        '<button id="imp-select-all" type="button" class="btn btn-sm">Select All</button>' +
        '<button id="imp-deselect-all" type="button" class="btn btn-sm">Deselect All</button>' +
        '<button id="imp-commit-btn" type="button" class="btn btn-primary btn-sm">' + renderIcon('check', 'sm') + '<span data-btn-label>Commit Selected Rows</span></button>' +
      '</div></div>' +
      '<div class="tbl-wrap" style="border:none;"><table class="tbl"><thead><tr><th class="tbl-th">Import</th><th class="tbl-th">Source</th><th class="tbl-th">Record</th><th class="tbl-th num">Amount</th><th class="tbl-th">Stage</th><th class="tbl-th">Anomalies</th></tr></thead><tbody>' +
      (rowsHtml || '<tr><td colspan="6" class="tbl-td muted">No rows match the preview filter.</td></tr>') +
      '</tbody></table></div>' + renderPaginationBar(paged.pagination, 'imp', [10, 25, 50, 100]) + '</div>';

    document.getElementById('imp-anom-only').addEventListener('change', function(e) {
      state.impPage.anomaliesOnly = e.target.checked;
      state.impPage.page = 1;
      renderImportPreview();
    });
    document.getElementById('imp-select-all').addEventListener('click', function() {
      for (var k = 0; k < indexed.length; k++) indexed[k].row.skipImport = false;
      renderImportPreview();
    });
    document.getElementById('imp-deselect-all').addEventListener('click', function() {
      for (var k = 0; k < indexed.length; k++) indexed[k].row.skipImport = true;
      renderImportPreview();
    });

    bindPaginationBar('imp', paged.pagination, function(pg) {
      state.impPage.page = pg;
      renderImportPreview();
    }, function(sz) {
      state.impPage.pageSize = sz;
      state.impPage.page = 1;
      renderImportPreview();
    });

    mount.querySelectorAll('[data-imp-skip]').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var i = parseInt(cb.getAttribute('data-imp-skip'), 10);
        state.importPreview.previewRows[i].skipImport = !cb.checked;
      });
    });

    document.getElementById('imp-commit-btn').addEventListener('click', function() {
      var btn = document.getElementById('imp-commit-btn');
      setBtnLoading(btn, true, 'Importing...', 'Commit Selected Rows');
      callApi('apiCommitImport', state.token, {
        targetModule: state.importPreview.targetModule,
        rows: state.importPreview.previewRows
      }).then(function(res) {
        invalidateClientCache();
        toast('Imported ' + res.importedCount + ' records (skipped ' + res.skippedDuplicatesCount + ').', 'ok');
        state.importPreview = null;
        renderImportView();
      }).catch(function(err) {
        toast(err.message, 'error');
        setBtnLoading(btn, false, 'Importing...', 'Commit Selected Rows');
      });
    });
  }

  function downloadCsvExport(moduleName, filters) {
    callApi('apiExportCsv', state.token, { moduleName: moduleName, filters: filters }).then(function(res) {
      var blob = new Blob([res.csvContent], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = res.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Exported ' + res.filename, 'ok');
    }).catch(function(err) { toast(err.message, 'error'); });
  }

    '</div>' +

    (rows || '<tr><td colspan="6" class="tbl-td muted">No audit records match your filters.</td></tr>') +
    '</tbody></table>' + renderPaginationBar(pg, 'audit', [10, 25, 50, 100]) + '</div>';

    document.getElementById('view-root').innerHTML = html;

    function applyAuditFilters() {
      state.auditFilters.search = document.getElementById('aud-f-search').value;

    document.getElementById('aud-f-mod').addEventListener('change', applyAuditFilters);
    document.getElementById('aud-f-search').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') applyAuditFilters();
    });
    bindPaginationBar('audit', pg, function(nextPage) {
      state.auditFilters.page = nextPage;
      loadAuditView();
    }, function(nextSize) {
      state.auditFilters.pageSize = nextSize;
      state.auditFilters.page = 1;
      loadAuditView();
    });
  }

  // ==================== MY PROFILE ====================
  function bindProfileHandlersOnce() {
    if (state.profileHandlersBound) return;
    state.profileHandlersBound = true;

    var uploadBtn = document.getElementById('prof-upload-btn');
    var photoInput = document.getElementById('prof-photo-input');
    var removeBtn = document.getElementById('prof-remove-photo-btn');
    var logoutBtn = document.getElementById('prof-logout-btn');
    var accountForm = document.getElementById('prof-account-form');
    var pwdForm = document.getElementById('prof-password-form');

    if (uploadBtn && photoInput) {
      uploadBtn.addEventListener('click', function() { photoInput.click(); });
      photoInput.addEventListener('change', function() {
        var file = photoInput.files[0];
        photoInput.value = '';
        if (!file) return;
        if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) {
          toast('Please select a JPEG, PNG, or WebP image.', 'error');
          return;
        }
        setBtnLoading(uploadBtn, true, 'Uploading...', 'Upload Photo');
        resizeImageToDataUrl(file, 256, function(dataUrl) {
          callApi('apiUpdateMyPhoto', state.token, dataUrl).then(function(res) {
            state.user = res.user;
            invalidateClientCache();
            renderSidebarUser();
            renderProfileHero();
            loadProfileActivity(true);
            setBtnLoading(uploadBtn, false, 'Uploading...', state.user.photo_data ? 'Change Photo' : 'Upload Photo');
            toast('Profile photo updated.', 'ok');
          }).catch(function(err) {
            toast(err.message, 'error');
            setBtnLoading(uploadBtn, false, 'Uploading...', state.user.photo_data ? 'Change Photo' : 'Upload Photo');
          });
        }, function(errMsg) {
          toast(errMsg, 'error');
          setBtnLoading(uploadBtn, false, 'Uploading...', state.user.photo_data ? 'Change Photo' : 'Upload Photo');
        });
      });
    }

    if (removeBtn) {
      removeBtn.addEventListener('click', function() {
        if (!confirm('Remove your profile photo?')) return;
        setBtnLoading(removeBtn, true, 'Removing...', 'Remove Photo');
        callApi('apiUpdateMyPhoto', state.token, '').then(function(res) {
          state.user = res.user;
          invalidateClientCache();
          renderSidebarUser();
          renderProfileHero();
          loadProfileActivity(true);
          setBtnLoading(removeBtn, false, 'Removing...', 'Remove Photo');
          toast('Profile photo removed.', 'ok');
        }).catch(function(err) {
          toast(err.message, 'error');
          setBtnLoading(removeBtn, false, 'Removing...', 'Remove Photo');
        });
      });
    }

    if (logoutBtn) {
      logoutBtn.addEventListener('click', performSignOut);
    }

    if (accountForm) {
      accountForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var saveBtn = document.getElementById('prof-save-account-btn');
        setBtnLoading(saveBtn, true, 'Saving...', 'Save Account Info');
        callApi('apiUpdateMyProfile', state.token, {
          full_name: document.getElementById('prof-fullname').value,
          email: document.getElementById('prof-email').value
        }).then(function(res) {
          state.user = res.user;
          invalidateClientCache();
          renderSidebarUser();
          renderProfileHero();
          loadProfileActivity(true);
          setBtnLoading(saveBtn, false, 'Saving...', 'Save Account Info');
          toast('Profile information updated.', 'ok');
        }).catch(function(err) {
          toast(err.message, 'error');
          setBtnLoading(saveBtn, false, 'Saving...', 'Save Account Info');
        });
      });
    }

    if (pwdForm) {
      pwdForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var curr = document.getElementById('prof-pwd-curr').value;
        var next = document.getElementById('prof-pwd-next').value;
        var confirmPwd = document.getElementById('prof-pwd-confirm').value;
        if (next !== confirmPwd) {
          toast('New password and confirmation do not match.', 'error');
          return;
        }
        var savePwdBtn = document.getElementById('prof-save-pwd-btn');
        setBtnLoading(savePwdBtn, true, 'Updating...', 'Update Password');
        callApi('apiChangePassword', state.token, curr, next).then(function(res) {
          state.user = res.user;
          pwdForm.reset();
          loadProfileActivity(true);
          setBtnLoading(savePwdBtn, false, 'Updating...', 'Update Password');
          toast('Password updated successfully.', 'ok');
        }).catch(function(err) {
          toast(err.message, 'error');
          setBtnLoading(savePwdBtn, false, 'Updating...', 'Update Password');
        });
      });
    }
  }

  function resizeImageToDataUrl(file, size, onSuccess, onError) {
    var reader = new FileReader();
    reader.onerror = function() { onError('Could not read selected image file.'); };
    reader.onload = function() {
      var img = new Image();
      img.onerror = function() { onError('Invalid image file.'); };
      img.onload = function() {
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        var minSide = Math.min(img.width, img.height);
        var sx = Math.floor((img.width - minSide) / 2);
        var sy = Math.floor((img.height - minSide) / 2);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
        var quality = 0.82;
        var out = canvas.toDataURL('image/jpeg', quality);
        while (out.length > 44000 && quality > 0.35) {
          quality -= 0.1;
          out = canvas.toDataURL('image/jpeg', quality);
        }
        if (out.length > 44500) {
          onError('Compressed image is still too large. Please try a simpler image.');
          return;
        }
        onSuccess(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function renderProfileHero() {
    var u = state.user || {};
    renderAvatarElements('prof-avatar-img', 'prof-avatar-initials', u);
    document.getElementById('prof-hero-name').textContent = u.full_name || u.username || '';
    document.getElementById('prof-hero-username').textContent = '@' + (u.username || '');
    document.getElementById('prof-hero-role').textContent = u.role_label || u.role || '';
    var stEl = document.getElementById('prof-hero-status');
    stEl.textContent = (u.is_active === false) ? 'DISABLED' : 'ACTIVE';
    stEl.className = 'status-badge ' + ((u.is_active === false) ? 'badge-danger' : 'badge-ok');
    document.getElementById('prof-hero-created').textContent = u.created_at ? String(u.created_at).slice(0, 10) : '—';
    document.getElementById('prof-hero-lastlogin').textContent = u.last_login ? String(u.last_login).replace('T', ' ').slice(0, 19) : '—';

    var uploadLabel = document.querySelector('#prof-upload-btn [data-btn-label]');
    if (uploadLabel) uploadLabel.textContent = u.photo_data ? 'Change Photo' : 'Upload Photo';
    var remBtn = document.getElementById('prof-remove-photo-btn');
    if (remBtn) remBtn.classList.toggle('hidden', !u.photo_data);

    document.getElementById('prof-username-ro').value = u.username || '';
    document.getElementById('prof-role-ro').value = u.role_label || u.role || '';
    document.getElementById('prof-fullname').value = u.full_name || '';
    document.getElementById('prof-email').value = u.email || '';
  }

  function loadProfileActivity(forceReload) {
    if (!state.user) return;
    var pgState = state.profileAuditPage;
    var filters = { actor: state.user.username, page: pgState.page, pageSize: pgState.pageSize };
    var cacheKey = 'prof_act:' + JSON.stringify(filters);
    if (!forceReload && state.cache[cacheKey]) {
      renderProfileActivity(state.cache[cacheKey]);
      return;
    }
    callApi('apiListAuditLogs', state.token, filters).then(function(res) {
      state.cache[cacheKey] = res;
      renderProfileActivity(res);
    }).catch(function(err) {
      var body = document.getElementById('prof-activity-body');
      if (body) body.innerHTML = '<tr><td colspan="5" class="tbl-td muted">' + esc(err.message) + '</td></tr>';
    });
  }

  function renderProfileActivity(res) {
    var items = (res && res.items) ? res.items : [];
    var pg = res ? res.pagination : null;
    var countEl = document.getElementById('prof-activity-count');
    if (countEl && pg) countEl.textContent = pg.totalItems + ' entries';

    var rows = items.map(function(l) {
      return '<tr class="tbl-row"><td class="tbl-td mono">' + esc(l.timestamp) + '</td>' +
        '<td class="tbl-td"><span class="status-badge">' + esc(l.module) + '</span></td>' +
        '<td class="tbl-td mono">' + esc(l.record_id) + '</td>' +
        '<td class="tbl-td">' + esc(l.action) + '</td>' +
        '<td class="tbl-td">' + esc(l.summary) + '</td></tr>';
    }).join('');
    document.getElementById('prof-activity-body').innerHTML = rows || '<tr><td colspan="5" class="tbl-td muted">No recent activity found.</td></tr>';
    document.getElementById('prof-activity-pg').innerHTML = renderPaginationBar(pg, 'prof-audit', [5, 10, 25]);

    bindPaginationBar('prof-audit', pg, function(nextPage) {
      state.profileAuditPage.page = nextPage;
      loadProfileActivity(false);
    }, function(nextSize) {
      state.profileAuditPage.pageSize = nextSize;
      state.profileAuditPage.page = 1;
      loadProfileActivity(false);
    });
  }

  function loadProfileView(forceReload) {
    initStaticIcons();
    bindProfileHandlersOnce();
    renderProfileHero();
    if (forceReload || !state.cache.myProfileLoaded) {
      callApi('apiGetMyProfile', state.token).then(function(user) {
        state.user = Object.assign({}, state.user, user);
        state.cache.myProfileLoaded = true;
        renderSidebarUser();
        renderProfileHero();
      }).catch(function(err) { toast(err.message, 'error'); });
    }
    loadProfileActivity(forceReload);
  }

  function performSignOut() {
    var tok = state.token;
    state.token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    invalidateClientCache();
    callApi('apiLogout', tok).catch(function() {});
    showLogin();
  }

  // ==================== DRAWER & MODAL HELPERS ====================
  function openDrawer(bodyHtml, footHtml) {
    document.getElementById('drawer-body').innerHTML = bodyHtml;
    document.getElementById('drawer-foot').innerHTML = footHtml;
    document.getElementById('drawer-backdrop').classList.remove('hidden');
    var cancelBtn = document.getElementById('drawer-cancel-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', closeDrawer);
  }
  function closeDrawer() {
    document.getElementById('drawer-backdrop').classList.add('hidden');
  }
  function openModal(html) {
    document.getElementById('modal-card').innerHTML = html;
    document.getElementById('modal-backdrop').classList.remove('hidden');
    var closeBtn = document.getElementById('modal-close-btn');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
  }
  function closeModal() {
    document.getElementById('modal-backdrop').classList.add('hidden');
  }

  function openPasswordModal(forced) {
    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="margin:0;">' + (forced ? 'Change Initial Password Required' : 'Change Password') + '</h3>' +
      (forced ? '' : '<button type="button" class="btn btn-sm" id="modal-close-btn">Close</button>') + '</div>' +
      '<form id="pwd-modal-form">' +
      '<div class="form-group"><label class="form-label">Current Password</label><input name="curr" type="password" class="form-input" required /></div>' +
      '<div class="form-group"><label class="form-label">New Password (min 8 chars)</label><input name="next" type="password" class="form-input" minlength="8" required /></div>' +
      '<button type="submit" class="btn btn-primary btn-sm">Update Password</button></form>';
    openModal(html);
    document.getElementById('pwd-modal-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var f = e.target;
      callApi('apiChangePassword', state.token, f.curr.value, f.next.value).then(function(res) {
        state.user = res.user;
        closeModal();
        toast('Password updated successfully.', 'ok');
      }).catch(function(err) { toast(err.message, 'error'); });
    });
  }

  // ==================== EVENT LISTENERS ====================
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('login-submit-btn');
    var errEl = document.getElementById('login-error');
    errEl.classList.add('hidden');
    setBtnLoading(btn, true, 'Signing In...', 'Sign In');
    var u = document.getElementById('login-username').value;
    var p = document.getElementById('login-password').value;
    callApi('apiLogin', u, p).then(function(res) {
      state.token = res.token;
      sessionStorage.setItem(TOKEN_KEY, res.token);
      state.user = res.user;
      state.permissions = res.permissions;
      state.masters = res.masters || { items: [], grouped: {} };
      state.rawSheets = res.rawSheets || [];
      invalidateClientCache();
      setBtnLoading(btn, false, 'Signing In...', 'Sign In');
      initStaticIcons();
      showApp();
      if (state.user.must_change_password) {
        openPasswordModal(true);
      }
    }).catch(function(err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
      setBtnLoading(btn, false, 'Signing In...', 'Sign In');
    });
  });

  var userCard = document.getElementById('sidebar-user-card');
  if (userCard) {
    userCard.addEventListener('click', function() {
      navigate('profile');
    });
  }

  window.addEventListener('popstate', function(e) {
    if (!state.token || !state.user) return;
    var nextView = (e.state && e.state.viewId) ? e.state.viewId : '';
    if (!nextView && window.location && window.location.search) {
      try {
        nextView = (new URLSearchParams(window.location.search).get('page') || '').toLowerCase();
      } catch (err) {}
    }
    navigate(nextView || 'dashboard', true);
  });

  document.getElementById('btn-refresh').addEventListener('click', function() {
    invalidateClientCache();
    if (state.activeView === 'dashboard') loadDashboard(true);
    else if (state.activeView === 'sss') loadSss(true);
    else if (state.activeView === 'insurance') loadInsurance(true);
    else if (state.activeView === 'admin') loadAdminView(true);
    else if (state.activeView === 'audit') loadAuditView(true);
    else if (state.activeView === 'profile') loadProfileView(true);
    else navigate(state.activeView, true);
  });
  var headerLogoutBtn = document.getElementById('header-logout-btn');
  if (headerLogoutBtn) {
    headerLogoutBtn.addEventListener('click', performSignOut);
  }
  document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);

  bootstrap();
})();
</script>
